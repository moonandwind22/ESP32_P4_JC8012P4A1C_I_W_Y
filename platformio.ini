; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32p4-local

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.psram = enabled
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.flash_size = 16MB
board_build.partitions = app3M_fat9M_fact512k_16MB.csv
test_build_src = no
test_framework = unity
build_flags = 
	-DLV_CONF_INCLUDE_SIMPLE
	-Ilib
	-Iinclude
	-Isrc
lib_deps = lvgl/lvgl@^9.5.0
	bblanchon/ArduinoJson@^7.4.2

[env:esp32p4-local]
extends = env:esp32p4
build_flags =
	${env:esp32p4.build_flags}
	-DLONDONBRIEF_DATA_SOURCE=0
	-DLONDONBRIEF_C6_TRANSPORT=0

[env:esp32p4-local-wifi-debug]
extends = env:esp32p4-local
build_flags =
	${env:esp32p4-local.build_flags}
	-DLONDONBRIEF_WIFI_DEBUG=1

[env:esp32p4-local-service-debug]
extends = env:esp32p4-local
build_flags =
	${env:esp32p4-local.build_flags}
	-DLONDONBRIEF_SERVICE_DEBUG=1

[env:esp32p4-local-full-debug]
extends = env:esp32p4-local
build_flags =
	${env:esp32p4-local.build_flags}
	-DLONDONBRIEF_WIFI_DEBUG=1
	-DLONDONBRIEF_SERVICE_DEBUG=1

[env:esp32p4-c6-sdio-worker]
extends = env:esp32p4
build_flags =
	${env:esp32p4.build_flags}
	-DLONDONBRIEF_DATA_SOURCE=2
	-DLONDONBRIEF_C6_TRANSPORT=2

[env:esp32p4-c6-worker]
extends = env:esp32p4-c6-sdio-worker

[env:esp32p4-c6-uart-worker]
extends = env:esp32p4
build_flags =
	${env:esp32p4.build_flags}
	-DLONDONBRIEF_DATA_SOURCE=1
	-DLONDONBRIEF_C6_TRANSPORT=1
	-DLONDONBRIEF_C6_SERIAL_RX_PIN=-1
	-DLONDONBRIEF_C6_SERIAL_TX_PIN=-1

[env:esp32p4-test]
extends = env:esp32p4-local
lib_deps =
	${env:esp32p4.lib_deps}
	throwtheswitch/Unity@^2.6.1
